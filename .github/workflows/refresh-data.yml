# Nightly / weekly IMDb Loom data refresh + Pages redeploy
name: Refresh Loom Data

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: loom-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync

      - name: Download IMDb datasets
        working-directory: pipeline
        run: uv run loom download

      - name: Convert to Parquet
        working-directory: pipeline
        run: uv run loom parquet

      - name: Enrich (Bechdel + Wikidata; TMDB if key present)
        working-directory: pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY=$TMDB_API_KEY" > .env
            uv run loom enrich
          else
            uv run loom enrich --skip-tmdb
          fi
          # Fail if gender was expected but empty, or wikidata_people missing after extras
          python3 - <<'PY'
          from pathlib import Path
          cache = Path("../data/cache")
          wd = cache / "wikidata_people.parquet"
          gender = cache / "gender.parquet"
          import os
          if os.environ.get("TMDB_API_KEY") and (not gender.exists() or gender.stat().st_size < 500):
              raise SystemExit("gender.parquet empty/missing after enrich with TMDB_API_KEY")
          if not wd.exists() or wd.stat().st_size < 1000:
              raise SystemExit("wikidata_people.parquet missing/empty after enrich")
          print("enrich caches ok")
          PY

      - name: Build all constructs
        working-directory: pipeline
        run: uv run loom build --construct all --top-n 160

      - name: Validate canaries
        working-directory: pipeline
        run: uv run loom validate || true
        # soft until canaries stabilize on CI data snapshot; local builds enforce harder

      - name: Sync public data for Pages
        run: bash scripts/sync-public-data.sh

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/out app/public/data || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: weekly IMDb Loom data refresh"
            git push
          fi

  pages:
    needs: refresh
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Pages
        working-directory: app
        run: npm ci && npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
