[project]
name = "imbd-loom"
version = "0.1.0"
description = "IMDb Loom data pipeline — DuckDB crunch + TMDB/Wikidata enrichment"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyarrow>=17.0.0",
]

[project.scripts]
loom = "loom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
